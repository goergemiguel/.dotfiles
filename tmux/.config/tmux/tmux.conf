# restart config using leader + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Fix color of neovim to match when opening inside tmux session
set-option -sa terminal-overrides ",xterm*:Tc"

# Change prefix to ctrl + space
# on MacOS disable keyboard shortcut with ctrl + space to switch input sources
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# mouse support
set -g mouse on

# Start windows and panes index at 1 instead of 0
set -g base-index 1

# move status bar to top
set-option -g status-position top

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.2'

# Window management
unbind %
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"
bind ] next-window
bind [ previous-window

# Configure the catppuccin plugin
set -g @catppuccin_flavour 'frappe' # latte,frappe, macchiato or mocha
set -g @catppuccin_window_status_style "rounded"

# Load plugins if necessary
run ~/.config/tmux/plugins/tmux/catppuccin.tmux

# Catppuccin theming
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"

# Initialize TMUX plugin manager
run ~/.config/tmux/plugins/tpm/tpm
